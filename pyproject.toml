[project]
name = "RAG_against_the_machine"
version = "0.1.0"
description = "RAG against the machine - Next step LLMs"
requires-python = ">=3.10"
authors = [{ name="Oleksandr Bachurin", email="bachurin_s@yahoo.de" }]
dependencies = [
	"pydantic>=2.11.9",
	"numpy>=1.26",
	"flake8>=7.0",
	"mypy>=1.0",
	"bm25s>=0.2.0",
	"tqdm>=4.66.0",
	"stubs",
	"transformers>=4.40.0",
	"torch>=2.0.0",
	"accelerate",
	"fire",
#	"huggingface-hub>=0.20.0",
#	"ast",
    ]

readme = "README.md"

packages = [{ include = "src" }] 

[tool.setuptools]
package-dir = {"" = "."} 

[project.scripts]
index = "src.__main__:main" 

