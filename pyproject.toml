[project]
name = "RAG against the machine"
version = "0.1.0"
description = "RAG against the machine - Next step LLMs"
requires-python = ">=3.10"
authors = [{ name="Oleksandr Bachurin", email="bachurin_s@yahoo.de" }]
dependencies = [
	"pydantic>=2.11.9",
	"numpy>=1.26",
	"flake8>=7.0",
	"mypy>=1.0",
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    ]
readme = "README.md"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llm_sdk"]
